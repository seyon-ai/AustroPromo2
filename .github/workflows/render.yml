name: Render Promo
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id"
        default: "AustroClashPromo"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render landscape
        run: npx remotion render ${{ github.event.inputs.composition || 'AustroClashPromo' }} out/AustroClashPromo.mp4 --codec=h264 --crf=18 --concurrency=2
      - name: Render vertical
        if: github.event_name == 'workflow_dispatch'
        run: npx remotion render AustroClashPromoVertical out/AustroClashPromoVertical.mp4 --codec=h264 --crf=18 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: austroclash-promo
          path: out/*.mp4
          retention-days: 14
